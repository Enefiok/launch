<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <div class="panel">

      <div class="rule"></div>
      <h1 class="headline">We Are <span class="headline-accent">Coming Soon</span>!</h1>
      <p class="tagline">A space to work, learn, and build, that's PiHub. Coworking, private rooms, and hands-on tech training in web dev, data analysis, AI, and cybersecurity.</p>
      <div class="rule"></div>

      <div class="countdown" id="countdown" aria-label="Countdown to launch">
        <div class="cd-block">
          <span class="cd-num" id="cd-days">00</span>
          <span class="cd-label">Days</span>
        </div>
        <span class="cd-colon">:</span>
        <div class="cd-block">
          <span class="cd-num" id="cd-hours">00</span>
          <span class="cd-label">Hours</span>
        </div>
        <span class="cd-colon">:</span>
        <div class="cd-block">
          <span class="cd-num" id="cd-mins">00</span>
          <span class="cd-label">Minutes</span>
        </div>
        <span class="cd-colon">:</span>
        <div class="cd-block">
          <span class="cd-num" id="cd-secs">00</span>
          <span class="cd-label">Seconds</span>
        </div>
      </div>

      <form class="waitlist-card" id="waitlistForm" novalidate>
        <h2 class="waitlist-title">Join our waitlist</h2>
        <p class="waitlist-subtext" id="formHint">Be the first to know when we launch.</p>
        <div class="input-row">
          <input
            type="email"
            id="emailInput"
            placeholder="Enter email"
            required
            aria-label="Email address"
          />
          <button type="submit" id="subscribeBtn">Join waitlist</button>
        </div>

        <div class="social-row" aria-label="Follow us on social media">
          <a href="https://www.facebook.com/profile.php?id=61593336062853&mibextid=rS40aB7S9Ucbxw6v" class="social-icon" aria-label="Facebook" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06C2 17.08 5.66 21.23 10.44 22V14.96H7.9V12.06H10.44V9.84C10.44 7.32 11.93 5.93 14.22 5.93C15.31 5.93 16.45 6.13 16.45 6.13V8.62H15.19C13.95 8.62 13.56 9.39 13.56 10.18V12.06H16.34L15.89 14.96H13.56V22C18.34 21.23 22 17.08 22 12.06Z" fill="currentColor"/>
            </svg>
          </a>
          <a href="https://www.instagram.com/prestigeinnovationhub?igsi=MWZza2JqZzE3ZjJrdQ==" class="social-icon" aria-label="Instagram" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="2" width="20" height="20" rx="5.5" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="12" r="4.4" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="17.4" cy="6.6" r="1.15" fill="currentColor"/>
            </svg>
          </a>
          <a href="https://www.tiktok.com/@prestige.innovati7?_r=1&_t=ZS-99HHmDOISmr" class="social-icon" aria-label="TikTok" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16.5 2H13.6V15.4C13.6 16.83 12.44 18 11 18C9.56 18 8.4 16.83 8.4 15.4C8.4 13.98 9.56 12.8 11 12.8C11.28 12.8 11.55 12.85 11.8 12.93V9.98C11.53 9.94 11.27 9.92 11 9.92C7.92 9.92 5.42 12.36 5.42 15.4C5.42 18.44 7.92 20.9 11 20.9C14.08 20.9 16.58 18.44 16.58 15.4V8.53C17.62 9.28 18.9 9.72 20.28 9.72V6.85C18.19 6.85 16.5 5.19 16.5 3.14V2Z" fill="currentColor"/>
            </svg>
          </a>
        </div>
      </form>

    </div>

    <div class="watermark" aria-hidden="true">Waitlist</div>
  </main>

  <!-- Confetti Library (Added for celebration animation) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
